name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: TypeScript + Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: https://example.invalid

      - name: Verify generated SEO files
        run: |
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -q "https://example.invalid/" dist/sitemap.xml
          grep -q "Disallow: /admin" dist/robots.txt
